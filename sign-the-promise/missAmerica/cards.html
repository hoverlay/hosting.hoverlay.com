<!DOCTYPE html>
<html>
<head>
    <title>Miss America Delegate Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background:
                radial-gradient(ellipse at 80% 0%, rgba(229, 200, 143, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 0%, rgba(251, 236, 209, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(251, 248, 241, 0.5) 0%, transparent 40%),
                linear-gradient(135deg,
                    rgba(229, 200, 143, 0.3) 0%,
                    transparent 30%,
                    transparent 100%),
                linear-gradient(to bottom,
                    #fbecd1 0%,
                    #fbf8f1 20%,
                    #e5c88f 30%,
                    #c5b599 45%,
                    #565c65 60%,
                    #25344e 75%,
                    #021432 90%);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./assets/images/background.jpeg') center/cover;
            opacity: 1; /* Adjust 0-1: controls how much the bokeh shows */
            pointer-events: none;
            z-index: 0;
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        .control-bar {
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
        }

        .back-button {
            background: transparent;
            border: none;
            color: rgba(0, 0, 0, 0.6);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem;
            transition: opacity 0.3s ease;
        }

        .back-button:hover {
            opacity: 0.7;
        }

        .back-button::before {
            content: '←';
            font-size: 1.3rem;
        }

        .header {
            padding: 1rem;
            text-align: center;
            color: #011140;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: regular;
            margin-bottom: 0.3rem;
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 300;
        }

        .carousel-container {
            flex: 1;
            display: flex;
            align-items: flex-start;
            overflow-x: scroll;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding: 2rem 1rem;
        }

        .carousel-container::-webkit-scrollbar {
            display: none;
        }

        .instructions-overlay {
            position: fixed;
            top: calc(1rem + 78px);
            left: 50%;
            transform: translateX(-50%);
            color: rgba(26, 84, 144, 1);
            font-size: 0.95rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
        }

        .card-wrapper {
            flex: 0 0 auto;
            max-height: 100%;
            scroll-snap-align: center;
            padding: 0 0.5rem;
            perspective: 1000px;
            position: relative;
            z-index: 1;
        }

        .card {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(229, 200, 143, 0.4),
                        0 0 40px rgba(251, 236, 209, 0.2);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            backface-visibility: hidden;
            border-radius: 15px;
            overflow: hidden;
            background: white;
        }

        .card-face img {
            display: block;
            max-height: calc(100vh - 12rem);
            max-width: calc(100vw - 4rem);
            width: auto;
            height: auto;
        }

        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .card-front {
            transform: rotateY(0deg);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .tap-icon {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            font-size: 2rem;
            color: #becada;
            animation: pulse 2s infinite;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card.flipped .tap-icon {
            display: none;
        }

        .star-button-container {
            position: absolute;
            bottom: 1.5rem;
            left: calc(0% - 10px);
            transform: rotateY(180deg);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .star-popup {
            background: rgba(0, 0, 0, 0.95);
            color: #B49B57;
            padding: 0.6rem 1.2rem;
            border-radius: 15px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            z-index: 101;
            position: relative;
        }

        .star-popup.visible {
            opacity: 1;
        }

        .found-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s ease;
            position: relative;
        }

        .found-toggle img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .star-checkmark {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #28a745;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .found-toggle.starred .star-checkmark {
            display: flex;
        }

        .card.flipped .star-button-container {
            display: flex;
        }

        .found-toggle:active {
            transform: scale(0.9);
        }

        .found-badge {
            position: absolute;
            top: -15px;
            right: 1rem;
            display: none;
            z-index: 10;
        }

        .found-badge img {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 4px 12px rgba(40, 167, 69, 0.6));
        }

        .card.found .found-badge {
            display: block;
        }

        .card.flipped .found-badge {
            display: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        .celebration i {
            position: absolute;
            font-size: 3rem;
            animation: celebrate 1.5s ease-out forwards;
        }

        @keyframes celebrate {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rotate));
            }
        }

        @keyframes badgePop {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.3) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .card.found .found-badge {
            animation: badgePop 0.6s ease-out;
        }

        .scroll-indicator {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(26, 84, 144, 0.5);
            font-size: 2rem;
            animation: slideHint 2s infinite;
            pointer-events: none;
        }

        @keyframes slideHint {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(-50%) translateX(0);
            }
            50% {
                opacity: 0.7;
                transform: translateY(-50%) translateX(-10px);
            }
        }

        .footer {
            padding: 1rem;
            text-align: center;
            color: #B49B57;
            background: #021432;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="control-bar">
            <button onclick="location.href='hobject://do?when_done=hide'" class="back-button">Back to Menu</button>
        </div>
        <div class="header">
            <h1>Meet The Delegates</h1>
            <p>Tap to flip &nbsp;&nbsp;• &nbsp;Swipe to explore</p>
        </div>

        <div class="carousel-container" id="carousel">
            <!-- Cards will be dynamically inserted here -->
        </div>

        <div class="scroll-indicator">›</div>

        <div class="footer">
            
        </div>
    </div>

    <script>
        // Local storage helper functions
        function getFoundCards() {
            const found = localStorage.getItem('missAmericaFound');
            return found ? JSON.parse(found) : {};
        }

        function setCardFound(cardName, isFound) {
            const foundCards = getFoundCards();
            foundCards[cardName] = isFound;
            localStorage.setItem('missAmericaFound', JSON.stringify(foundCards));
        }

        function isCardFound(cardName) {
            const foundCards = getFoundCards();
            return foundCards[cardName] === true;
        }

        // Card data - 53 cards
        const cards = [
            { name: 'Miss America', hasBack: true },
            { name: 'Alabama', hasBack: true },
            { name: 'Alaska', hasBack: true },
            { name: 'Arizona', hasBack: true },
            { name: 'Arkansas', hasBack: true },
            { name: 'California', hasBack: true },
            { name: 'Colorado', hasBack: true },
            { name: 'Connecticut', hasBack: true },
            { name: 'Delaware', hasBack: true },
            { name: 'Florida', hasBack: true },
            { name: 'Georgia', hasBack: true },
            { name: 'Hawaii', hasBack: true },
            { name: 'Idaho', hasBack: true },
            { name: 'Illinois', hasBack: true },
            { name: 'Indiana', hasBack: true },
            { name: 'Iowa', hasBack: true },
            { name: 'Kansas', hasBack: true },
            { name: 'Kentucky', hasBack: true },
            { name: 'Louisiana', hasBack: true },
            { name: 'Maine', hasBack: true },
            { name: 'Maryland', hasBack: true },
            { name: 'Massachusetts', hasBack: true },
            { name: 'Michigan', hasBack: true },
            { name: 'Minnesota', hasBack: true },
            { name: 'Mississippi', hasBack: true },
            { name: 'Missouri', hasBack: true },
            { name: 'Montana', hasBack: true },
            { name: 'Nebraska', hasBack: true },
            { name: 'Nevada', hasBack: true },
            { name: 'New Hampshire', hasBack: true },
            { name: 'New Jersey', hasBack: true },
            { name: 'New Mexico', hasBack: true },
            { name: 'New York', hasBack: true },
            { name: 'North Carolina', hasBack: true },
            { name: 'North Dakota', hasBack: true },
            { name: 'Ohio', hasBack: true },
            { name: 'Oklahoma', hasBack: true },
            { name: 'Oregon', hasBack: true },
            { name: 'Pennsylvania', hasBack: true },
            { name: 'Puerto Rico', hasBack: true },
            { name: 'Rhode Island', hasBack: true },
            { name: 'South Carolina', hasBack: true },
            { name: 'South Dakota', hasBack: true },
            { name: 'Tennessee', hasBack: true },
            { name: 'Texas', hasBack: true },
            { name: 'Utah', hasBack: true },
            { name: 'Vermont', hasBack: true },
            { name: 'Virginia', hasBack: true },
            { name: 'Washington', hasBack: true },
            { name: 'West Virginia', hasBack: true },
            { name: 'Wisconsin', hasBack: true },
            { name: 'Wyoming', hasBack: true }
        ];

        const carousel = document.getElementById('carousel');

        // Generate cards dynamically
        cards.forEach((card, index) => {
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'card-wrapper';

            const cardElement = document.createElement('div');
            cardElement.className = 'card';

            // Front face
            const frontFace = document.createElement('div');
            frontFace.className = 'card-face card-front';
            const frontImg = document.createElement('img');
            frontImg.src = `./assets/images/cards/${card.name} F.jpeg`;
            frontImg.alt = `Card ${index + 1} front`;
            frontFace.appendChild(frontImg);

            // Back face
            const backFace = document.createElement('div');
            backFace.className = 'card-face card-back';

            if (card.hasBack) {
                const backImg = document.createElement('img');
                backImg.src = `./assets/images/cards/${card.name} B.png`;
                backImg.alt = `Card ${index + 1} back`;
                backFace.appendChild(backImg);
            } else {
                // If no back image, show a placeholder
                backFace.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 1.2rem; color: #666; padding: 2rem; text-align: center;">More information coming soon</div>';
            }

            // Tap icon
            const tapIcon = document.createElement('i');
            tapIcon.className = 'fas fa-hand-point-up tap-icon';

            cardElement.appendChild(frontFace);
            cardElement.appendChild(backFace);
            cardElement.appendChild(tapIcon);

            // Add "Starred" badge on front (star image)
            const foundBadge = document.createElement('div');
            foundBadge.className = 'found-badge';
            const frontStarImg = document.createElement('img');
            frontStarImg.src = './assets/images/miss-america-star.png';
            frontStarImg.alt = 'Starred';
            foundBadge.appendChild(frontStarImg);
            cardElement.appendChild(foundBadge);

            // Check if card is already starred
            if (isCardFound(card.name)) {
                cardElement.classList.add('found');
            }

            // Add "Star" toggle button on back with popup (skip for first card - Miss America)
            let starPopup = null;
            if (index !== 0) {
                const starContainer = document.createElement('div');
                starContainer.className = 'star-button-container';

                starPopup = document.createElement('div');
                starPopup.className = 'star-popup';
                starPopup.textContent = 'Star this delegate';

                const foundToggle = document.createElement('button');
                foundToggle.className = 'found-toggle';
                if (isCardFound(card.name)) {
                    foundToggle.classList.add('starred');
                }

                const starImg = document.createElement('img');
                starImg.src = './assets/images/miss-america-star.png';
                starImg.alt = 'Star';
                foundToggle.appendChild(starImg);

                const checkmark = document.createElement('div');
                checkmark.className = 'star-checkmark';
                checkmark.innerHTML = '✓';
                foundToggle.appendChild(checkmark);

                foundToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const isFound = cardElement.classList.toggle('found');
                    setCardFound(card.name, isFound);

                    // Hide popup when clicked
                    if (starPopup) {
                        starPopup.classList.remove('visible');
                    }

                    // Toggle checkmark
                    if (isFound) {
                        foundToggle.classList.add('starred');
                        // Trigger celebration effect
                        showCelebration();

                        // Flip card back to front after celebration
                        setTimeout(() => {
                            cardElement.classList.remove('flipped');
                        }, 1500);
                    } else {
                        foundToggle.classList.remove('starred');
                    }
                });

                starContainer.appendChild(starPopup);
                starContainer.appendChild(foundToggle);
                cardElement.appendChild(starContainer);
            }

            // Add click handler to flip card
            cardElement.addEventListener('click', function(e) {
                e.stopPropagation();

                const wasFlipped = this.classList.contains('flipped');

                // If not flipped (tapping front), send message to Unity
                if (!wasFlipped) {
                    location.href = `space://do?action=send_event&event_message=card-${(index + 1).toString().padStart(2, '0')}-viewed`;
                }

                this.classList.toggle('flipped');

                // Show popup after a few seconds when card is flipped (only for delegate cards, not Miss America)
                if (index !== 0 && starPopup) {
                    // After flipping, check if we're now showing the back
                    setTimeout(() => {
                        const isNowFlipped = this.classList.contains('flipped');

                        if (isNowFlipped && !wasFlipped) {
                            // Just flipped to back - show popup immediately
                            starPopup.classList.add('visible');

                            // Hide popup after 3 seconds
                            setTimeout(() => {
                                starPopup.classList.remove('visible');
                            }, 3000);
                        } else if (!isNowFlipped) {
                            // Flipped back to front - clear popup
                            starPopup.classList.remove('visible');
                        }
                    }, 700);
                }
            });

            cardWrapper.appendChild(cardElement);
            carousel.appendChild(cardWrapper);
        });

        // Celebration effect when marking as found
        function showCelebration() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            document.body.appendChild(celebration);

            // Create multiple celebration icons
            const icons = ['⭐', '✨', '🎊', '⭐', '✨', '⭐'];
            const colors = ['#FFD700', '#FF6B35', '#28a745', '#1a5490', '#FF1493'];

            for (let i = 0; i < 12; i++) {
                const icon = document.createElement('i');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                icon.textContent = randomIcon;
                icon.style.color = randomColor;

                // Random direction - burst upward (upper half of circle)
                const angle = Math.PI + (i / 12) * Math.PI; // Range from π to 2π (upper directions)
                const distance = 150 + Math.random() * 100;
                const tx = Math.cos(angle) * distance + 'px';
                const ty = Math.sin(angle) * distance + 'px';
                const rotate = Math.random() * 720 - 360 + 'deg';

                icon.style.setProperty('--tx', tx);
                icon.style.setProperty('--ty', ty);
                icon.style.setProperty('--rotate', rotate);

                celebration.appendChild(icon);
            }

            // Remove celebration after animation
            setTimeout(() => {
                celebration.remove();
            }, 1500);
        }

        // Hide scroll indicator after first interaction
        let hasScrolled = false;
        carousel.addEventListener('scroll', function() {
            if (!hasScrolled) {
                hasScrolled = true;
                document.querySelector('.scroll-indicator').style.display = 'none';
            }
        });

        // Also hide on first tap
        document.addEventListener('click', function() {
            if (!hasScrolled) {
                document.querySelector('.scroll-indicator').style.display = 'none';
            }
        }, { once: true });
    </script>
</body>
</html>
