<!DOCTYPE html>
<html>
<head>
    <title>Fireworks Launcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <style>
        @font-face {
            font-family:"Belinda-W00-Regular";
            src:url("./assets/fonts/242487aa-209a-4dbd-aca2-64a3c73a8946.woff2") format("woff2"),url("./assets/fonts/4381b252-d9f8-4201-bbf3-9440e21259e7.woff") format("woff");
            font-display: block;
        }
        html {
            font-size: 18px;
            line-height: 1.5;
            font-weight: 200;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            height: 180px;
            overflow: hidden; /* Prevents scrolling if the content exceeds the viewport */
            background-color: #f5f5f5;
            background-attachment: fixed;
        }
        /* Center the title */
        .title {
            text-align: center;
            font-size: 4rem;
            font-family: 'Belinda-W00-Regular', sans-serif;
        }
        .subtitle {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 200;
            font-family: 'Georgia', serif;
        }

        .close-button {
            position: absolute;
            right: 10px;
            top: 4px;
            background: none;
            border: none;
            font-size: 24px;
            color: #666666;
            cursor: pointer;
        }

        .close-button i {
            pointer-events: none;
        }
        /* Carousel container */
        .carousel {
            display: flex;
            height: 100%;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            overflow-y: hidden;
            background-color: #f5f5f5;
        }

        /* Individual poster */
        .poster {
            flex: 0 0 auto;
            width: 53%;
            height: 100%;
            scroll-snap-align: start;
            background-color: transparent;
            text-align: center;
            margin: 1rem;
            perspective: 1000px;
        }

        .front {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            background-color: transparent;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .front:active {
            transform: scale(0.95);
        }

        .front img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .front h2 {
            z-index: 2;
            position: absolute;
            font-size: 3rem;
            bottom: 0;
            width: 90%;
            padding: .5rem;
            background: linear-gradient(to top, rgba(255,255,255,0.95), rgba(255,255,255,0.6));
            color: #333333;
            text-align: center;
        }


        .launch-effect {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            color: #4a90e2;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .launch-effect.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .launch-message {
            display: none;
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            font-weight: 400;
            color: #ffffff;
            background-color: #4a90e2;
            padding: 0.4rem 1rem;
            border-radius: 7px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .tap-icon {
            position: absolute;
            bottom:  30%;
            left: 50%;
            transform: translateX(-50%);
            font-size:  1.5rem;
            color: #4a90e2;
            z-index: 3;
        }

        .scroll-arrow {
            position: absolute;
            right: 10px;
            top: 90px;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #cccccc;
            z-index: 3;
            cursor: pointer;
        }

        .cooldown-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 245, 245, 0.9);
            z-index: 15;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .cooldown-overlay.active {
            display: flex;
        }

        .progress-ring-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .progress-ring {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.1s linear;
            stroke: #4a90e2;
            stroke-width: 8;
            fill: transparent;
        }

        .cooldown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333333;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }

        .cooldown-message {
            color: #333333;
            font-size: 1.2rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 400;
        }

        .poster.disabled {
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

        <div class="poster" onclick="handleCardClick(event, 'story-6')">

        <div class="scroll-arrow">

    <script>
        // Configuration
        const COOLDOWN_SECONDS = 4; // Cooldown period after launching story

        // Set the size of the font based on the width of the webview
        document.addEventListener("DOMContentLoaded", function() {
            var webviewHeight = window.innerHeight; // Gets the height of the webview
            var baseFontSize = webviewHeight / 70;
            document.documentElement.style.fontSize = baseFontSize + 'px';

            // Start carousel offset to the right and animate back to show users they can swipe
            const carousel = document.querySelector('.carousel');
            const posters = document.querySelectorAll('.poster');

            // Disable snap immediately on carousel and posters
            carousel.style.scrollSnapType = 'none';
            posters.forEach(poster => {
                poster.style.scrollSnapAlign = 'none';
            });

            // Wait for layout to complete
            setTimeout(() => {
                const maxScroll = carousel.scrollWidth - carousel.clientWidth;
                const offsetAmount = Math.min(1600, maxScroll); // Use max available or 1600px
                const duration = 1500; // animation duration in ms

                // Force scroll position
                carousel.scrollLeft = offsetAmount;

                // Force a reflow to ensure scrollLeft is set
                void carousel.offsetHeight;

                // Wait a bit longer before starting animation
                setTimeout(() => {
                    const startTime = performance.now();
                    const startPos = offsetAmount; // Use the intended offset, not the actual scrollLeft

                    function easeInOutCubic(t) {
                        return t < 0.5
                            ? 4 * t * t * t
                            : 1 - Math.pow(-2 * t + 2, 3) / 2;
                    }

                    function animate(currentTime) {
                        const elapsed = currentTime - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = easeInOutCubic(progress);

                        // Calculate target position and clamp to prevent overshoot
                        const targetScroll = Math.max(0, startPos - (startPos * eased));
                        carousel.scrollLeft = targetScroll;

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            // Ensure we're exactly at 0
                            carousel.scrollLeft = 0;

                            // Re-enable snap after a small delay
                            setTimeout(() => {
                                carousel.style.scrollSnapType = 'x mandatory';
                                posters.forEach(poster => {
                                    poster.style.scrollSnapAlign = 'start';
                                });
                            }, 100);
                        }
                    }

                    requestAnimationFrame(animate);
                }, 200);
            }, 100);
        });

        function handleCardClick(event, storyName) {
            const poster = event.currentTarget;

            // Prevent multiple clicks during cooldown
            if (poster.classList.contains('disabled')) {
                return;
            }

            const launchEffect = poster.querySelector('.launch-effect');
            const launchMessage = poster.querySelector('.launch-message');
            const cooldownOverlay = poster.querySelector('.cooldown-overlay');
            const cooldownText = poster.querySelector('.cooldown-text');
            const progressCircle = poster.querySelector('.progress-ring-circle');

            function launchStory() {
                // Send event to launch story immediately
                location.href = `space://do?action=send_event&event_message=${storyName}&when_done=hide`;

                // Start cooldown immediately
                startCooldown();
            }

            function startCooldown() {
                // Disable only this poster
                poster.classList.add('disabled');

                // Show cooldown overlay
                cooldownOverlay.classList.add('active');

                const circumference = 2 * Math.PI * 50; // 2πr where r=50
                let remainingTime = COOLDOWN_SECONDS;

                // Update countdown every 100ms for smooth progress
                const interval = setInterval(() => {
                    remainingTime -= 0.1;

                    if (remainingTime <= 0) {
                        clearInterval(interval);
                        cooldownOverlay.classList.remove('active');
                        poster.classList.remove('disabled');
                        return;
                    }

                    // Update text
                    cooldownText.textContent = Math.ceil(remainingTime);

                    // Update circular progress
                    const progress = remainingTime / COOLDOWN_SECONDS;
                    const offset = circumference * (1 - progress);
                    progressCircle.style.strokeDashoffset = offset;
                }, 100);
            }

            // Launch immediately (no countdown)
            launchStory();
        }
    </script>
