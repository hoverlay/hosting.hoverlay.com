<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign the Constitution Collectible</title>
  <style>
    :root {
      --purple: #350E36;
      --purple-soft: #5a2a5c;
      --yellow: #FFD024;
      --yellow-soft: #ffe37a;
      --text-muted: #7a5f7c;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.12);
      --radius-lg: 24px;
      --radius-pill: 999px;
      --transition-fast: 180ms ease-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
      background: radial-gradient(circle at top, #4a1a4d 0, #350E36 50%, #250926 100%);
      color: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
      white-space: nowrap;
    }

    /* Badge display */
    .badge-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(53, 14, 54, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease-out;
      padding: 20px;
    }

    .badge-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .badge-container {
      background: white;
      border-radius: 16px;
      padding: 15px 20px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transform: scale(0.5) rotateY(180deg);
      transition: transform 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .badge-overlay.show .badge-container {
      transform: scale(1) rotateY(0deg);
    }

    .badge-title {
      font-size: 1rem;
      color: var(--purple);
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .badge-image {
      width: auto;
      max-width: 340px;
      max-height: 220px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(255, 208, 36, 0.45));
      animation: badgeSpin 800ms ease-out;
      -webkit-user-select: none;
      user-select: none;
    }

    .badge-image-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .save-instruction {
      font-size: 0.85rem;
      color: var(--purple);
      text-align: center;
      font-weight: bold;
      max-width: 280px;
      background: rgba(255, 208, 36, 0.18);
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px dashed var(--yellow);
    }

    @keyframes badgeSpin {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.1) rotate(10deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .badge-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-download {
      background: var(--yellow);
      color: var(--purple);
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 8px 18px rgba(255, 208, 36, 0.4);
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(255, 208, 36, 0.5);
    }
  </style>
</head>
<body>
  <script>
    (function () {
      function showBadge() {
        // Track badge display
        const img = new Image();
        img.src = 'https://tour.51stepstofreedom.org/track/SIGN_CONST_COLLECTIBLE';

        // Create badge overlay
        const badgeOverlay = document.createElement('div');
        badgeOverlay.className = 'badge-overlay';

        // Create badge container
        const badgeContainer = document.createElement('div');
        badgeContainer.className = 'badge-container';

        // Title
        const title = document.createElement('div');
        title.className = 'badge-title';
        title.textContent = 'You Found a Collectible!';
        badgeContainer.appendChild(title);

        // Badge image wrapper
        const imageWrapper = document.createElement('div');
        imageWrapper.className = 'badge-image-wrapper';

        // Badge image
        const badgeImg = document.createElement('img');
        badgeImg.className = 'badge-image';
        badgeImg.src = './images/Badge-SIGN_CONST.png';
        badgeImg.alt = 'Sign the Constitution Collectible';
        imageWrapper.appendChild(badgeImg);

        // Save instruction
        const instruction = document.createElement('div');
        instruction.className = 'save-instruction';
        instruction.textContent = 'Tap and hold the collectible to save to your photos';
        imageWrapper.appendChild(instruction);

        badgeContainer.appendChild(imageWrapper);

        // Buttons
        const buttonContainer = document.createElement('div');
        buttonContainer.className = 'badge-buttons';

        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn btn-download';
        closeBtn.textContent = 'Done';
        closeBtn.onclick = () => {
          badgeOverlay.classList.remove('show');
          setTimeout(() => {
            badgeOverlay.remove();
            // Send event to Unity to close the browser
            location.href = `space://do?action=send_event&event_message=sent&when_done=hide`;
          }, 500);
        };
        buttonContainer.appendChild(closeBtn);

        badgeContainer.appendChild(buttonContainer);
        badgeOverlay.appendChild(badgeContainer);
        document.body.appendChild(badgeOverlay);

        // Trigger animation
        setTimeout(() => {
          badgeOverlay.classList.add('show');
        }, 10);
      }

      showBadge();
    })();
  </script>
</body>
</html>
