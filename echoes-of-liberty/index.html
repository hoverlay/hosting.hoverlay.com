<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Liberty - AR Experiences</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #ededed;
            padding: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 667px) and (orientation: landscape) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        .card {
            position: relative;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            aspect-ratio: 3/4;
            cursor: pointer;
        }

        .card.full-width {
            grid-column: 1 / -1;
            aspect-ratio: 16/9;
        }

        .card.unlocked::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 24px;
            color: rgb(71, 247, 138);
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card.locked::before {
            content: '\f023';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 24px;
            color: white;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Color grading filters for visual consistency */
            filter:
                brightness(0.95)
                contrast(1.1)
                saturate(0.85)
                sepia(0.15)
                hue-rotate(-5deg);
            transition: filter 0.3s ease;
        }

        .card:hover img {
            filter:
                brightness(1.05)
                contrast(1.15)
                saturate(0.9)
                sepia(0.05)
                hue-rotate(-5deg);
        }

        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.4) 30%, rgba(0, 0, 0, 0.9));
            color: white;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .card.coming-soon::after {
            content: 'Coming Soon';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 600;
            z-index: 3;
        }

        .card.coming-soon {
            opacity: 0.7;
            cursor: default;
        }

        .card.coming-soon:hover {
            transform: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 24px;
            padding: 0 16px;
        }

        .logo-container img {
            max-width: 300px;
            width: 100%;
            height: auto;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 16px;
        }

        .header {
            color: #333;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="./assets/images/echoes-of-liberty-logo.png" alt="Echoes of Liberty">
    </div>
    <div class="header-container">
        <div class="header">Tap a card to enter the experience</div>
    </div>
    <div class="gallery"></div>

    <script>
        // Echoes of Liberty AR experiences
        const cardData = [
            // {
            //     id: 'channel-link',
            //     title: 'Echoes of Liberty Channel',
            //     subtitle: 'View all experiences',
            //     image: './assets/images/echoes-channel-map.png',
            //     url: 'https://hoverlay.io/echoesofliberty',
            //     fullWidth: true
            // },
            {
                id: 'crispus-attucks',
                title: 'Crispus Attucks',
                subtitle: 'First to fall in the Boston Massacre. Memory debated and reclaimed.',
                image: './assets/images/cripus-attuck.jpg',
                spacePid: '74018'
            },
            {
                id: 'elizabeth-freeman',
                title: 'Elizabeth "Mum Bett" Freeman',
                subtitle: 'Sued for freedom in 1781 and Won! Helped end slavery in Massachusetts.',
                image: './assets/images/elizabeth-freeman.jpg',
                spacePid: '93742'
            },
            {
                id: 'prince-hall',
                title: 'Prince Hall',
                subtitle: 'Boston leader who built schools and mutual aid through the Mason Grand African Lodge.',
                image: './assets/images/prince-hall.jpg',
                spacePid: '9in'
            },
            {
                id: 'freeman-dubois',
                title: 'Elizabeth Freeman & W.E.B. Du Bois',
                subtitle: '',
                image: './assets/images/freeman-dubois.jpg',
                spacePid: 'yg1p'
            }
        ];

        const gallery = document.querySelector('.gallery');

        // Track visited spaces in localStorage
        const getVisitedSpaces = () => {
            const visited = localStorage.getItem('echoes-visited');
            return visited ? JSON.parse(visited) : [];
        };

        const markSpaceVisited = (spaceId) => {
            const visited = getVisitedSpaces();
            if (!visited.includes(spaceId)) {
                visited.push(spaceId);
                localStorage.setItem('echoes-visited', JSON.stringify(visited));
            }
        };

        const visitedSpaces = getVisitedSpaces();

        cardData.forEach(data => {
            const card = document.createElement('div');
            const isVisited = data.spacePid && visitedSpaces.includes(data.spacePid);
            card.className = `card ${isVisited ? 'unlocked' : ''} ${data.fullWidth ? 'full-width' : ''} ${data.comingSoon ? 'coming-soon' : ''}`;
            card.innerHTML = `
				<img src="${data.image}" alt="${data.title}" style="${data.imageClass != null ? `transform: scale(${data.imageClass}); object-fit: contain;` : ''}">
                <div class="card-content">
                    <h2 class="card-title">${data.title}</h2>
                    ${data.subtitle ? `<p class="card-subtitle">${data.subtitle}</p>` : ''}
                </div>
            `;
            card.onclick = () => {
                if (data.comingSoon) return;
                if (data.spacePid) {
                    markSpaceVisited(data.spacePid);
                }
                if (data.url) {
                    window.open(data.url, '_blank');
                } else {
                    window.location.href = `https://hoverlay.io/space/${data.spacePid}`;
                }
            };
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
